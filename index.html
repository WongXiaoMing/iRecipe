<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食物照片转菜谱系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-item {
            display: block;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            font-size: 18px;
            font-weight: 500;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .menu-item:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .menu-item-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .description {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ 食物照片转菜谱系统</h1>
        <p class="subtitle">自动化处理照片，轻松管理家庭菜谱</p>
        
        <div class="menu">
            <a href="/browse.html" class="menu-item">
                <span class="menu-item-icon">📸</span>
                照片/贴纸浏览管理
            </a>
            <a href="/recipe.html" class="menu-item">
                <span class="menu-item-icon">📖</span>
                菜谱展示与点餐
            </a>
        </div>

        <div class="description">
            <p><strong>使用说明：</strong></p>
            <p>1. 运行照片处理脚本处理NAS中的照片</p>
            <p>2. 在浏览页标记和管理贴纸</p>
            <p>3. 在菜谱页查看和点餐</p>
        </div>
    </div>
</body>
</html>
