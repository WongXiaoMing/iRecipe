<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜谱展示 - 点餐系统</title>
    <link rel="stylesheet" href="recipe-style.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

.header {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    text-align: center;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ 家庭菜谱</h1>
            <p class="subtitle">浏览已标记的菜品，勾选您想点的菜</p>
        </div>

        <div class="order-summary">
            <h3>📋 已选菜品 (<span id="orderCount">0</span>)</h3>
            <div class="order-list" id="orderList">
                <div style="color: #999; text-align: center; padding: 20px;">暂无选择</div>
            </div>
            <div class="order-total">共 <span id="totalCount">0</span> 道菜</div>
            <button class="clear-order" onclick="clearOrder()">清空选择</button>
        </div>

        <div class="filter-bar">
            <input type="text" class="filter-input" id="searchInput" 
                   placeholder="🔍 搜索菜名、原料或做法..." 
                   oninput="filterDishes()">
        </div>

        <div class="dishes-grid" id="dishesGrid">
            <div class="empty-state">
                <h2>加载中...</h2>
            </div>
        </div>
    </div>
    <script src="recipe.js"></script>

    <script>
        
    </script>
</body>
</html>
